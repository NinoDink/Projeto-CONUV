<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Produtos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="produtos.html">Projeto 2</a>
    <div class="navbar-nav">
      <a class="nav-link active" href="produtos.html">Produtos</a>
      <a class="nav-link" href="clientes.html">Clientes</a>
      <a class="nav-link" href="vendas.html">Vendas</a>
    </div>
  </div>
</nav>

<div class="container">
  <h2 class="mb-3">Cadastro de Produtos</h2>

  <form id="formProduto" class="mb-3">
    <input type="hidden" id="produtoId">
    <div class="mb-3">
      <label class="form-label">Nome</label>
      <input type="text" id="nome" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Descrição</label>
      <textarea id="descricao" class="form-control" rows="2"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Preço (R$)</label>
      <input type="number" id="valor" class="form-control" step="0.01" min="0" required>
    </div>
    <button type="submit" class="btn btn-primary" id="btnSalvar">Cadastrar</button>
    <button type="button" class="btn btn-secondary d-none" id="btnCancelar">Cancelar</button>
  </form>

  <div id="mensagem" class="text-success fw-semibold mb-3"></div>

  <h4>Produtos cadastrados</h4>
  <table class="table table-striped bg-white shadow-sm">
    <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Descrição</th>
        <th>Preço</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabelaProdutos"></tbody>
  </table>
</div>

<script>
  const API_BASE = "/api";
  const form = document.getElementById("formProduto");
  const msg = document.getElementById("mensagem");
  const tbody = document.getElementById("tabelaProdutos");
  let produtos = [];

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function mostrarMensagem(texto, erro = false) {
    msg.textContent = texto;
    msg.className = (erro ? "text-danger" : "text-success") + " fw-semibold mb-3";
  }

  function formatBRL(num) {
    return Number(num).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }

  async function carregarProdutos() {
    const res = await fetch(`${API_BASE}/produtos`);
    produtos = await res.json();
    tbody.innerHTML = "";

    produtos.forEach(p => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${p.id}</td>
        <td>${esc(p.nome)}</td>
        <td>${esc(p.descricao)}</td>
        <td>${formatBRL(p.valor)}</td>
        <td>
          <button class="btn btn-primary btn-sm" data-acao="editar" data-id="${p.id}">Editar</button>
          <button class="btn btn-danger btn-sm" data-acao="excluir" data-id="${p.id}">Excluir</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  tbody.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-acao]");
    if (!btn) return;
    const id = Number(btn.dataset.id);
    if (btn.dataset.acao === "editar") editar(id);
    if (btn.dataset.acao === "excluir") excluir(id);
  });

  function editar(id) {
    const p = produtos.find(x => x.id === id);
    if (!p) return;
    document.getElementById("produtoId").value = p.id;
    document.getElementById("nome").value = p.nome;
    document.getElementById("descricao").value = p.descricao || "";
    document.getElementById("valor").value = p.valor;
    document.getElementById("btnSalvar").textContent = "Atualizar";
    document.getElementById("btnCancelar").classList.remove("d-none");
  }

  function limparFormulario() {
    form.reset();
    document.getElementById("produtoId").value = "";
    document.getElementById("btnSalvar").textContent = "Cadastrar";
    document.getElementById("btnCancelar").classList.add("d-none");
  }

  document.getElementById("btnCancelar").addEventListener("click", limparFormulario);

  async function excluir(id) {
    const res = await fetch(`${API_BASE}/produtos/${id}`, { method: "DELETE" });
    if (res.ok) {
      mostrarMensagem("Produto excluído com sucesso!");
    } else if (res.status === 409) {
      mostrarMensagem("Não é possível excluir: o produto está sendo usado em uma venda.", true);
    } else {
      mostrarMensagem("Erro ao excluir o produto.", true);
    }
    carregarProdutos();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = document.getElementById("produtoId").value;
    const payload = {
      nome: document.getElementById("nome").value.trim(),
      descricao: document.getElementById("descricao").value.trim(),
      valor: parseFloat(document.getElementById("valor").value)
    };

    const url = id ? `${API_BASE}/produtos/${id}` : `${API_BASE}/produtos`;
    const method = id ? "PUT" : "POST";

    const res = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      mostrarMensagem("Erro ao salvar o produto.", true);
      return;
    }

    mostrarMensagem(id ? "Produto atualizado com sucesso!" : "Produto cadastrado com sucesso!");
    limparFormulario();
    carregarProdutos();
  });

  carregarProdutos();
</script>
</body>
</html>
