<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="produtos.html">Projeto 2</a>
    <div class="navbar-nav">
      <a class="nav-link" href="produtos.html">Produtos</a>
      <a class="nav-link active" href="clientes.html">Clientes</a>
      <a class="nav-link" href="vendas.html">Vendas</a>
    </div>
  </div>
</nav>

<div class="container">
  <h2 class="mb-3">Cadastro de Clientes</h2>

  <form id="formCliente" class="row g-3 mb-3">
    <input type="hidden" id="clienteId">
    <div class="col-md-6">
      <label class="form-label">Nome</label>
      <input type="text" id="nome" class="form-control" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">CPF</label>
      <input type="text" id="cpf" class="form-control" placeholder="000.000.000-00" maxlength="14" required>
    </div>
    <div class="col-md-2">
      <label class="form-label">Idade</label>
      <input type="number" id="idade" class="form-control" min="0" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Profissão</label>
      <input type="text" id="profissao" class="form-control">
    </div>
    <div class="col-md-6">
      <label class="form-label">Endereço</label>
      <input type="text" id="endereco" class="form-control">
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-primary" id="btnSalvar">Cadastrar</button>
      <button type="button" class="btn btn-secondary d-none" id="btnCancelar">Cancelar</button>
    </div>
  </form>

  <div id="mensagem" class="text-success fw-semibold mb-3"></div>

  <h4>Clientes cadastrados</h4>
  <table class="table table-striped bg-white shadow-sm">
    <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>CPF</th>
        <th>Idade</th>
        <th>Profissão</th>
        <th>Endereço</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabelaClientes"></tbody>
  </table>
</div>

<script>
  const API_BASE = "/api";
  const form = document.getElementById("formCliente");
  const msg = document.getElementById("mensagem");
  const tbody = document.getElementById("tabelaClientes");
  let clientes = [];

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function mostrarMensagem(texto, erro = false) {
    msg.textContent = texto;
    msg.className = (erro ? "text-danger" : "text-success") + " fw-semibold mb-3";
  }

  async function carregarClientes() {
    const res = await fetch(`${API_BASE}/clientes`);
    clientes = await res.json();
    tbody.innerHTML = "";

    clientes.forEach(c => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${c.id}</td>
        <td>${esc(c.nome)}</td>
        <td>${esc(c.cpf)}</td>
        <td>${c.idade}</td>
        <td>${esc(c.profissao)}</td>
        <td>${esc(c.endereco)}</td>
        <td>
          <button class="btn btn-primary btn-sm" data-acao="editar" data-id="${c.id}">Editar</button>
          <button class="btn btn-danger btn-sm" data-acao="excluir" data-id="${c.id}">Excluir</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  tbody.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-acao]");
    if (!btn) return;
    const id = Number(btn.dataset.id);
    if (btn.dataset.acao === "editar") editar(id);
    if (btn.dataset.acao === "excluir") excluir(id);
  });

  function editar(id) {
    const c = clientes.find(x => x.id === id);
    if (!c) return;
    document.getElementById("clienteId").value = c.id;
    document.getElementById("nome").value = c.nome;
    document.getElementById("cpf").value = c.cpf;
    document.getElementById("idade").value = c.idade;
    document.getElementById("profissao").value = c.profissao || "";
    document.getElementById("endereco").value = c.endereco || "";
    document.getElementById("btnSalvar").textContent = "Atualizar";
    document.getElementById("btnCancelar").classList.remove("d-none");
  }

  function limparFormulario() {
    form.reset();
    document.getElementById("clienteId").value = "";
    document.getElementById("btnSalvar").textContent = "Cadastrar";
    document.getElementById("btnCancelar").classList.add("d-none");
  }

  document.getElementById("btnCancelar").addEventListener("click", limparFormulario);

  async function excluir(id) {
    const res = await fetch(`${API_BASE}/clientes/${id}`, { method: "DELETE" });
    if (res.ok) {
      mostrarMensagem("Cliente excluído com sucesso!");
    } else if (res.status === 409) {
      mostrarMensagem("Não é possível excluir: o cliente possui vendas cadastradas.", true);
    } else {
      mostrarMensagem("Erro ao excluir o cliente.", true);
    }
    carregarClientes();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = document.getElementById("clienteId").value;
    const payload = {
      nome: document.getElementById("nome").value.trim(),
      cpf: document.getElementById("cpf").value.trim(),
      idade: parseInt(document.getElementById("idade").value, 10),
      profissao: document.getElementById("profissao").value.trim(),
      endereco: document.getElementById("endereco").value.trim()
    };

    const url = id ? `${API_BASE}/clientes/${id}` : `${API_BASE}/clientes`;
    const method = id ? "PUT" : "POST";

    const res = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      mostrarMensagem("Erro ao salvar o cliente.", true);
      return;
    }

    mostrarMensagem(id ? "Cliente atualizado com sucesso!" : "Cliente cadastrado com sucesso!");
    limparFormulario();
    carregarClientes();
  });

  carregarClientes();
</script>
</body>
</html>
